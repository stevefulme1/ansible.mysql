# Test mysql_router_info module

- name: Get MySQL Router info (REST API may not be available)
  ansible.mysql.mysql_router_info:
    router_host: "{{ router_host }}"
    router_port: "{{ router_port }}"
    use_ssl: true
    validate_certs: false
  register: result
  ignore_errors: true

- name: Assert result structure when succeeded
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.router_status is defined
      - result.routes is defined
      - result.destinations is defined
  when: result is succeeded
