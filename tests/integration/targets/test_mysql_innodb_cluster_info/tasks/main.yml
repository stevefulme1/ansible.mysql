# Test mysql_innodb_cluster_info module

- name: Get InnoDB Cluster info (no clusters)
  ansible.mysql.mysql_innodb_cluster_info:
    login_user: "{{ mysql_user }}"
    login_password: "{{ mysql_password }}"
    login_host: "{{ mysql_host }}"
    login_port: "{{ mysql_primary_port }}"
  register: result
  ignore_errors: true

- name: Assert result structure
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.clusters is defined
      - result.clusters | type_debug == 'list'

- name: Get InnoDB Cluster info with specific name
  ansible.mysql.mysql_innodb_cluster_info:
    name: nonexistentCluster
    login_user: "{{ mysql_user }}"
    login_password: "{{ mysql_password }}"
    login_host: "{{ mysql_host }}"
    login_port: "{{ mysql_primary_port }}"
  register: result
  ignore_errors: true

- name: Assert empty result for non-existent cluster
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.clusters | length == 0
  when: result is succeeded
